name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke-load the DLL
        shell: pwsh
        run: |
          $dll = "build/bin/Release/dlssnr_composite.dll"
          if (-not (Test-Path $dll)) { throw "missing $dll" }
          Add-Type -Namespace W -Name K -MemberDefinition '[DllImport("kernel32.dll", SetLastError=true)] public static extern IntPtr LoadLibrary(string p);'
          $h = [W.K]::LoadLibrary((Resolve-Path $dll))
          if ($h -eq [IntPtr]::Zero) { throw "LoadLibrary failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          Get-Content build/bin/Release/dlssnr_composite.log

      - name: Package
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace 'refs/tags/', '' } else { $env:GITHUB_SHA.Substring(0, 7) }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/bin/Release/dlssnr_composite.dll, build/bin/Release/dlssnr_composite.addon64, build/bin/Release/dlssnr_composite.asi, README.md package/
          if (Test-Path LICENSE) { Copy-Item LICENSE package/ }
          Compress-Archive -Path package/* -DestinationPath "DLSS-NR-Composite-$ver.zip"
          "ZIP=DLSS-NR-Composite-$ver.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: DLSS-NR-Composite
          path: package/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:ZIP" --title "${{ github.ref_name }}" --generate-notes
